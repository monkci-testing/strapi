name: CI Benchmark

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - monkci-ubuntu-24.04-4-6000iops
          - monkci-ubuntu-24.04-4-4000iops
          - monkci-ubuntu-24.04-4-3900iops
          - monkci-ubuntu-24.04-4-3600iops
          - depot-ubuntu-24.04-4
          - ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --inline-builds
        env:
          YARN_ENABLE_GLOBAL_CACHE: 'false'
          YARN_ENABLE_MIRROR: 'false'
          YARN_NM_MODE: 'hardlinks-local'

      - name: Build monorepo
        run: yarn nx run-many --targets build --nx-ignore-cycles --skip-nx-cache

      - name: Run backend unit tests
        run: yarn nx run-many --target=test:unit --nx-ignore-cycles -- --coverage

      - name: Run Vitest unit tests
        run: yarn test:unit:vitest
